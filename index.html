<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#0a0a1a">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    
    <style>
        
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #0f0f2a;
            --bg-card: rgba(15, 15, 40, 0.92);
            --bg-card-hover: rgba(25, 25, 60, 0.95);
            --bg-input: rgba(10, 10, 30, 0.8);
            --text-primary: #e8e8ff;
            --text-secondary: #a0a0cc;
            --text-muted: #6a6a99;
            
            --neon-pink: #ff2d75;
            --neon-blue: #00d4ff;
            --neon-purple: #a855f7;
            --neon-gold: #ffd700;
            --neon-green: #00ff88;
            --neon-cyan: #22d3ee;
            --neon-orange: #ff6b35;
            
            --border-glow-pink: rgba(255, 45, 117, 0.3);
            --border-glow-blue: rgba(0, 212, 255, 0.3);
            --border-glow-purple: rgba(168, 85, 247, 0.3);
            
            --shadow-pink: 0 0 30px rgba(255, 45, 117, 0.15);
            --shadow-blue: 0 0 30px rgba(0, 212, 255, 0.15);
            --shadow-gold: 0 0 30px rgba(255, 215, 0, 0.15);
        }

        [data-theme="light"] {
            --bg-primary: #f0edff;
            --bg-secondary: #ffffff;
            --bg-card: rgba(255, 255, 255, 0.95);
            --bg-card-hover: rgba(245, 245, 255, 0.98);
            --bg-input: rgba(255, 255, 255, 0.9);
            --text-primary: #1a1a3e;
            --text-secondary: #4a4a7a;
            --text-muted: #8a8aaa;
            
            --shadow-pink: 0 0 30px rgba(255, 45, 117, 0.08);
            --shadow-blue: 0 0 30px rgba(0, 212, 255, 0.08);
            --shadow-gold: 0 0 30px rgba(255, 215, 0, 0.08);
        }

        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-primary);
            font-family: 'Inter', 'Orbitron', system-ui, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.6s ease, color 0.6s ease;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--neon-pink), var(--neon-purple));
            border-radius: 10px;
        }

        
        .ddos-protection {
            background: linear-gradient(90deg, var(--neon-pink), var(--neon-gold), var(--neon-blue), var(--neon-purple));
            height: 3px;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1001;
            background-size: 300% 100%;
            animation: protectionFlow 3s ease infinite;
        }

        @keyframes protectionFlow {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 0%; }
            100% { background-position: 0% 0%; }
        }

        
        .security-badge {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(10, 10, 30, 0.85);
            backdrop-filter: blur(15px);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.6rem;
            z-index: 100;
            border: 1px solid rgba(0, 255, 136, 0.3);
            font-family: 'Fira Code', monospace;
            color: var(--neon-green);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 1px;
            animation: badgePulse 2s ease-in-out infinite;
        }

        @keyframes badgePulse {
            0%, 100% { border-color: rgba(0, 255, 136, 0.3); }
            50% { border-color: rgba(0, 255, 136, 0.8); }
        }

        .security-badge i {
            font-size: 0.8rem;
        }

        
        .bg-cyber {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: 
                radial-gradient(ellipse at 15% 25%, rgba(255, 45, 117, 0.12), transparent 50%),
                radial-gradient(ellipse at 85% 75%, rgba(0, 212, 255, 0.10), transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(168, 85, 247, 0.06), transparent 60%),
                radial-gradient(ellipse at 10% 80%, rgba(255, 215, 0, 0.04), transparent 40%),
                var(--bg-primary);
            transition: background 0.6s ease;
        }

        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: 
                linear-gradient(rgba(255, 45, 117, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            mask-image: radial-gradient(ellipse at center, black 40%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 70%);
        }

        
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--neon-blue);
            border-radius: 50%;
            animation: floatParticle linear infinite;
            opacity: 0.3;
        }

        .particle:nth-child(1) { left: 10%; animation-duration: 15s; animation-delay: 0s; background: var(--neon-pink); }
        .particle:nth-child(2) { left: 25%; animation-duration: 20s; animation-delay: 2s; background: var(--neon-purple); }
        .particle:nth-child(3) { left: 40%; animation-duration: 18s; animation-delay: 4s; background: var(--neon-cyan); }
        .particle:nth-child(4) { left: 55%; animation-duration: 22s; animation-delay: 1s; background: var(--neon-gold); }
        .particle:nth-child(5) { left: 70%; animation-duration: 16s; animation-delay: 3s; background: var(--neon-green); }
        .particle:nth-child(6) { left: 85%; animation-duration: 19s; animation-delay: 5s; background: var(--neon-orange); }
        .particle:nth-child(7) { left: 50%; animation-duration: 25s; animation-delay: 2s; background: var(--neon-pink); }
        .particle:nth-child(8) { left: 15%; animation-duration: 21s; animation-delay: 6s; background: var(--neon-blue); }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 15px 20px 100px;
        }


        .header {
            text-align: center;
            padding: 20px 0 15px;
            border-bottom: 2px solid var(--border-glow-pink);
            margin-bottom: 25px;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-pink), var(--neon-blue), transparent);
            filter: blur(4px);
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .logo-item {
            text-align: center;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            position: relative;
        }

        .logo-item:hover {
            transform: scale(1.08) translateY(-3px);
        }

        .logo-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 10px;
            display: block;
            border: 3px solid rgba(255, 45, 117, 0.4);

            background: linear-gradient(135deg, #1a1a3e, #2a1a4e);
            box-shadow: 0 0 20px rgba(255, 45, 117, 0.1);
        }

        .logo-item:hover .logo-img {
            border-color: var(--neon-gold);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.3), 0 0 80px rgba(255, 215, 0, 0.1);
        }

        .logo-item h3 {
            font-family: 'Orbitron', monospace;
            font-size: 0.7rem;
            color: var(--text-secondary);
            letter-spacing: 1px;

        }

        .logo-item:hover h3 {
            color: var(--neon-gold);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .collab-title {

            font-size: 0.85rem;
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-gold), var(--neon-blue), var(--neon-purple));
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientText 4s ease infinite;
            letter-spacing: 3px;
            font-weight: 700;
        }

        @keyframes gradientText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .btn {
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: 'Orbitron', monospace;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 52px;
            z-index: -1;
            filter: blur(8px);
            opacity: 0;
            transition: 0.4s;
        }

        .btn:hover::before {
            opacity: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--neon-pink), #cc2266);
            color: white;
            box-shadow: 0 0 25px rgba(255, 45, 117, 0.3);
        }
        .btn-primary::before {
            background: linear-gradient(135deg, var(--neon-pink), #ff6b9d);
        }
        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 45px rgba(255, 45, 117, 0.5);
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--neon-blue), #0088cc);
            color: white;
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.3);
        }
        .btn-secondary::before {
            background: linear-gradient(135deg, var(--neon-blue), #66ddff);
        }
        .btn-secondary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 45px rgba(0, 212, 255, 0.5);
        }

        .btn-warning {
            background: linear-gradient(135deg, var(--neon-gold), #e6a800);
            color: #0a0a1a;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
        }
        .btn-warning::before {
            background: linear-gradient(135deg, var(--neon-gold), #ffec80);
        }
        .btn-warning:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 45px rgba(255, 215, 0, 0.5);
        }

        .btn-purple {
            background: linear-gradient(135deg, var(--neon-purple), #7c3aed);
            color: white;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.3);
        }
        .btn-purple::before {
            background: linear-gradient(135deg, var(--neon-purple), #c084fc);
        }
        .btn-purple:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 45px rgba(168, 85, 247, 0.5);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--text-muted);
        }
        .btn-ghost:hover {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.1);
            transform: translateY(-3px);
        }

        
        .input-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 15px 0 25px;
        }

        .ip-input {
            background: var(--bg-input);
            border: 2px solid var(--border-glow-pink);
            border-radius: 50px;
            padding: 16px 28px;
            width: 340px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: 'Fira Code', monospace;
            outline: none;
            transition: 0.4s;
            backdrop-filter: blur(10px);
        }

        .ip-input::placeholder {
            color: var(--text-muted);
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
        }

        .ip-input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.15), inset 0 0 30px rgba(0, 212, 255, 0.05);
            transform: scale(1.01);
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 999;
            background: var(--bg-card);
            border: 1px solid var(--border-glow-pink);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.4s;
            color: var(--text-primary);
            font-size: 1.2rem;
            backdrop-filter: blur(15px);
        }

        .theme-toggle:hover {
            transform: rotate(30deg) scale(1.1);
            border-color: var(--neon-gold);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
        }

        
        .result-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 28px;
            margin: 20px 0;
            border: 1px solid var(--border-glow-pink);
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .result-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(255, 45, 117, 0.03), transparent 50%);
            pointer-events: none;
        }

        .result-card:hover {
            border-color: rgba(255, 45, 117, 0.5);
            box-shadow: var(--shadow-pink);
            transform: translateY(-2px);
        }

        .result-card.loading {
            text-align: center;
            padding: 50px;
        }

        .result-title {
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--neon-gold);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            color: var(--text-primary);
        }

        .result-title i {
            color: var(--neon-gold);
        }

        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 12px;
        }

        .info-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 14px 18px;
            border-left: 3px solid var(--neon-blue);
            transition: 0.3s;
            backdrop-filter: blur(5px);
        }

        .info-item:hover {
            background: rgba(0, 0, 0, 0.5);
            transform: translateX(4px);
            border-left-color: var(--neon-pink);
        }

        .info-label {
            font-size: 0.6rem;
            color: var(--neon-gold);
            letter-spacing: 1.5px;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .info-value {
            font-size: 0.9rem;
            font-family: 'Fira Code', monospace;
            word-break: break-all;
            color: var(--text-primary);
        }

        .info-value .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 6px;
        }

        .badge-danger { background: rgba(255, 45, 117, 0.3); color: var(--neon-pink); }
        .badge-success { background: rgba(0, 255, 136, 0.2); color: var(--neon-green); }
        .badge-warning { background: rgba(255, 215, 0, 0.2); color: var(--neon-gold); }
        .badge-info { background: rgba(0, 212, 255, 0.2); color: var(--neon-blue); }

        
        #map {
            height: 320px;
            border-radius: 16px;
            margin-top: 15px;
            border: 2px solid var(--border-glow-pink);
            transition: 0.4s;
            overflow: hidden;
        }

        #map:hover {
            border-color: var(--neon-blue);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.1);
        }

        .leaflet-control-zoom {
            border: none !important;
        }
        .leaflet-control-zoom a {
            background: var(--bg-card) !important;
            color: var(--text-primary) !important;
            border: 1px solid var(--border-glow-pink) !important;
        }

        
        .history-section {
            margin-top: 20px;
            padding: 15px 20px;
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid var(--border-glow-purple);
        }

        .history-section h4 {
            font-family: 'Orbitron', monospace;
            font-size: 0.8rem;
            color: var(--neon-purple);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .history-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 16px;
            border-radius: 20px;
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid transparent;
            color: var(--text-secondary);
        }

        .history-item:hover {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.1);
            transform: scale(1.05);
        }

        .clear-history {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .clear-history:hover {
            color: var(--neon-pink);
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(255, 45, 117, 0.15);
            border-top-color: var(--neon-pink);
            border-right-color: var(--neon-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        .spinner-ring {
            width: 80px;
            height: 80px;
            border: 3px solid transparent;
            border-top-color: var(--neon-pink);
            border-right-color: var(--neon-blue);
            border-bottom-color: var(--neon-purple);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
            position: relative;
        }

        .spinner-ring::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 3px solid transparent;
            border-top-color: var(--neon-gold);
            border-left-color: var(--neon-green);
            border-radius: 50%;
            animation: spin 0.6s linear infinite reverse;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-family: 'Orbitron', monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            animation: blinkText 1.2s ease-in-out infinite;
        }

        @keyframes blinkText {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow-pink);
            color: var(--text-primary);
            padding: 14px 28px;
            border-radius: 50px;
            z-index: 1000;
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-pink);
        }

        .toast.success {
            border-color: var(--neon-green);
        }
        .toast.error {
            border-color: var(--neon-pink);
        }
        .toast.info {
            border-color: var(--neon-blue);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(80px) scale(0.9); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }

        
        .error-card {
            background: rgba(255, 45, 117, 0.08);
            border: 1px solid var(--neon-pink);
            text-align: center;
            padding: 40px !important;
        }

        .error-card i {
            font-size: 3rem;
            color: var(--neon-pink);
            margin-bottom: 15px;
        }

        
        .footer {
            text-align: center;
            padding: 25px;
            margin-top: 30px;
            border-top: 1px solid var(--border-glow-pink);
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .footer strong {
            color: var(--neon-gold);
            font-family: 'Orbitron', monospace;
            font-weight: 700;

    <script>
        
        const themeToggle = document.getElementById('themeToggle');

            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            showToast(isDark ? '🌙 Karanlık tema' : '☀️ Aydınlık tema', 'info');
        });

        if (savedTheme === 'light') {

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-triangle',
                info: 'fa-info-circle'
            };
            toast.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> ${message}`;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(50px)';
                setTimeout(() => toast.remove(), 400);
            }, 3500);
        }

        
        function getHistory() {
            try {
                return JSON.parse(localStorage.getItem('ipHistory') || '[]');
            } catch { return []; }
        }

        function saveToHistory(ip, data) {
            const history = getHistory();
            const entry = {
                ip,
                timestamp: new Date().toISOString(),
                data: data
            };
            
            const existing = history.findIndex(h => h.ip === ip);
            if (existing !== -1) {
                history[existing] = entry;
            } else {
                history.unshift(entry);
            }
            
            localStorage.setItem('ipHistory', JSON.stringify(history.slice(0, 50)));
            renderHistory();
        }

        function renderHistory() {
            const history = getHistory();
            const list = document.getElementById('historyList');
            if (history.length === 0) {
                list.innerHTML = '<span style="color:var(--text-muted);font-size:0.8rem;">Henüz sorgu yok</span>';
                return;
            }
            list.innerHTML = history.map(h => 
                `<span class="history-item" data-ip="${h.ip}">${h.ip}</span>`
            ).join('');
            
            
            document.querySelectorAll('.history-item').forEach(el => {
                el.addEventListener('click', () => {
                    const ip = el.dataset.ip;
                    document.getElementById('ipInput').value = ip;
                    document.getElementById('queryBtn').click();
                });
            });
        }

        document.getElementById('clearHistory').addEventListener('click', () => {
            if (confirm('Geçmişi temizlemek istediğinize emin misiniz?')) {

        });

        
        async function queryIPWithFallback(ip) {

            
            try {
                const response = await fetch(`https://ipinfo.io/${encodeURIComponent(ip)}/json`);
                const data = await response.json();
                if (data && data.ip) {
                    return { source: 'ipinfo.io', data };
                }
                throw new Error('ipinfo.io boş veri döndü');
            } catch (error) {
                console.warn('ipinfo.io hatası, ip-api.com deneniyor...', error);
                
                try {
                    const response = await fetch(`https://ip-api.com/json/${encodeURIComponent(ip)}?fields=status,message,country,countryCode,region,regionName,city,zip,lat,lon,timezone,isp,org,as,query`);
                    const data = await response.json();
                    if (data.status === 'success') {
                        
                        const converted = {
                            ip: data.query,
                            country: data.country,
                            region: data.regionName,
                            city: data.city,
                            postal: data.zip,
                            loc: `${data.lat},${data.lon}`,
                            org: data.org || data.isp,
                            timezone: data.timezone,
                            asn: data.as,
                            source: 'ip-api.com'
                        };
                        return { source: 'ip-api.com', data: converted };
                    }
                    throw new Error(data.message || 'ip-api.com hatası');
                } catch (err) {
                    console.error('Tüm API\'ler başarısız:', err);
                    return { error: true, message: 'Tüm API kaynakları başarısız oldu. Lütfen daha sonra tekrar deneyin.' };
                }
            }
        }

        
        async function queryWhois(ip) {
            try {
                
                const response = await fetch(`https://ipwhois.app/json/${encodeURIComponent(ip)}`);
                const data = await response.json();
                if (data && !data.error) {
                    return {
                        org: data.org,
                        asn: data.asn,
                        isp: data.isp,
                        country: data.country
                    };
                }
                return null;
            } catch {
                return null;
            }
        }

        
        async function checkSecurity(ip) {
            try {
                
                const response = await fetch(`https://api.abuseipdb.com/api/v2/check?ipAddress=${ip}&maxAgeInDays=90`, {
                    headers: {
                        'Key': 'YOUR_ABUSEIPDB_API_KEY', 
                        'Accept': 'application/json'
                    }
                });
                if (response.ok) {
                    const data = await response.json();
                    if (data.data) {
                        return {
                            abuseScore: data.data.abuseConfidenceScore,
                            totalReports: data.data.totalReports,
                            isTor: data.data.isTor,
                            isProxy: data.data.isProxy,
                            isVpn: data.data.isVpn
                        };
                    }
                }
                return null;
            } catch {
                return null;
            }
        }

        async function scanPorts(ip) {
            const commonPorts = [80, 443, 22, 21, 25, 3306, 8080, 8443, 53, 110, 143];
            const openPorts = [];
            
            for (const port of commonPorts) {
                try {
                    
                    const img = new Image();
                    const startTime = Date.now();
                    img.src = `https://${ip}:${port}/favicon.ico`;
                    
                    await new Promise((resolve, reject) => {
                        img.onload = () => resolve();
                        img.onerror = () => reject();
                        setTimeout(() => reject(new Error('timeout')), 2000);
                    });
                    
                    openPorts.push(port);
                } catch {
                    
                }
            }
            
            return openPorts;
        }

        
        async function reverseDNS(ip) {
            try {
                const response = await fetch(`https://dns.google/resolve?name=${encodeURIComponent(ip)}&type=PTR`);
                const data = await response.json();
                if (data.Answer && data.Answer.length > 0) {
                    return data.Answer[0].data;
                }
                return null;
            } catch {
                return null;
            }
        }

        let mapInstance = null;
        let currentMapData = null;

        function displayResults(result, queryIp) {
            const container = document.getElementById('resultContainer');
            
            if (result.error) {
                container.innerHTML = `

            const security = data._security || null;

                    ${security.abuseScore > 50 ? '⚠️ Riskli' : '✅ Güvenli'} (${security.abuseScore}%)
                </span>` : '';

            
            const ports = data._ports || [];
            const portsHtml = ports.length > 0 ? 
                ports.map(p => `<span class="badge badge-info" style="margin:2px;">${p}</span>`).join('') :
                '<span style="color:var(--text-muted);font-size:0.7rem;">Taranmadı</span>';

            const html = `
                <div class="result-card" id="screenshotArea">
                    <div class="result-title">

                            <i class="fas fa-database"></i> ${source}
                        </span>
                    </div>
                    <div class="info-grid">
                        <div class="info-item"><div class="info-label">🌍 IP Adresi</div><div class="info-value">${data.ip || queryIp}</div></div>
                        <div class="info-item"><div class="info-label">📍 Konum</div><div class="info-value">${data.city || 'Bilinmiyor'}, ${data.region || 'Bilinmiyor'}</div></div>
                        <div class="info-item"><div class="info-label">🏙️ Şehir</div><div class="info-value">${data.city || 'Bilinmiyor'}</div></div>
                        <div class="info-item"><div class="info-label">🗺️ Bölge</div><div class="info-value">${data.region || 'Bilinmiyor'}</div></div>
                        <div class="info-item"><div class="info-label">📮 Posta Kodu</div><div class="info-value">${data.postal || 'Bilinmiyor'}</div></div>
                        <div class="info-item"><div class="info-label">📡 ISP / Organizasyon</div><div class="info-value">${data.org || 'Bilinmiyor'}</div></div>
                        <div class="info-item"><div class="info-label">🌍 Ülke</div><div class="info-value">${data.country || 'Bilinmiyor'}</div></div>
                        <div class="info-item"><div class="info-label">⏰ Zaman Dilimi</div><div class="info-value">${data.timezone || 'Bilinmiyor'}</div></div>
                        <div class="info-item"><div class="info-label">📌 Koordinat</div><div class="info-value">${data.loc || 'Bilinmiyor'}</div></div>
                        <div class="info-item"><div class="info-label">🔌 Açık Portlar</div><div class="info-value">${portsHtml}</div></div>
                        ${data._whois ? `
                        <div class="info-item"><div class="info-label">🏢 WHOIS</div><div class="info-value">${data._whois.org || 'Bilinmiyor'}</div></div>
                        ` : ''}
                        ${data._reverse ? `
                        <div class="info-item"><div class="info-label">🔄 Ters DNS</div><div class="info-value">${data._reverse}</div></div>
                        ` : ''}
                    </div>
                    <div style="margin-top:15px;display:flex;gap:15px;flex-wrap:wrap;align-items:center;">
                        <a href="${googleMapsLink}" target="_blank" class="map-link" style="color:var(--neon-blue);text-decoration:none;font-size:0.85rem;">
                            <i class="fas fa-map-marked-alt"></i> 📍 Google Maps'te Görüntüle
                        </a>
                        <button class="btn btn-ghost" onclick="exportResult()" style="padding:6px 18px;font-size:0.7rem;">
                            <i class="fas fa-file-export"></i> Dışa Aktar
                        </button>
                    </div>
                    <!-- Harita -->
                    <div id="map"></div>
                </div>
            `;

            container.innerHTML = html;

            
            if (coords && coords[0] && coords[1]) {
                currentMapData = { lat: coords[0], lon: coords[1] };
                setTimeout(() => initMap(coords[0], coords[1]), 100);
            }

            
            saveToHistory(queryIp, data);
        }

        function initMap(lat, lon) {
            const mapContainer = document.getElementById('map');
            if (!mapContainer) return;

            if (mapInstance) {
                mapInstance.remove();
                mapInstance = null;
            }

            mapInstance = L.map('map').setView([lat, lon], 12);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap',
                maxZoom: 19
            }).addTo(mapInstance);

            
            const customIcon = L.divIcon({
                className: 'custom-marker',
                html: `<div style="background:var(--neon-pink);width:20px;height:20px;border-radius:50%;border:3px solid white;box-shadow:0 0 30px rgba(255,45,117,0.6);"></div>`,
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });

            L.marker([lat, lon], { icon: customIcon })
                .addTo(mapInstance)
                .bindPopup(`📍 <b>${document.getElementById('ipInput').value}</b><br>${lat}, ${lon}`)
                .openPopup();

            
            setTimeout(() => {
                mapInstance.invalidateSize();
            }, 300);
        }

       
        function exportResult() {
            const card = document.getElementById('screenshotArea');
            if (!card) {
                showToast('⚠️ Önce bir IP sorgulayın!', 'error');
                return;
            }

           
            const items = card.querySelectorAll('.info-item');
            const data = {};
            items.forEach(item => {
                const label = item.querySelector('.info-label')?.textContent?.trim() || '';
                const value = item.querySelector('.info-value')?.textContent?.trim() || '';
                data[label] = value;
            });

           
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.download = `ip_export_${Date.now()}.json`;
            link.href = URL.createObjectURL(blob);
            link.click();
            URL.revokeObjectURL(link.href);

            showToast('✅ JSON olarak dışa aktarıldı!', 'success');
        }


        
        async function takeScreenshot() {
            const element = document.getElementById('resultContainer');
            const resultCard = element.querySelector('.result-card:not(.loading):not(.error-card)');
            
            if (!resultCard) {
                showToast('⚠️ Önce bir IP sorgulayın!', 'error');
                return;
            }

            showToast('📸 Ekran görüntüsü alınıyor...', 'info');
            
            try {
                const canvas = await html2canvas(resultCard, {
                    scale: 2,
                    backgroundColor: getComputedStyle(document.body).getPropertyValue('--bg-primary').trim() || '#0a0a1a',
                    logging: false,
                    useCORS: true,
                    allowTaint: true
                });
                
                const link = document.createElement('a');
                link.download = `ip_screenshot_${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                showToast('✅ Ekran görüntüsü kaydedildi!', 'success');
            } catch (error) {
                showToast(`❌ Hata: ${error.message}`, 'error');
            }
        }

        
        function batchQuery() {
            const input = document.getElementById('ipInput').value.trim();
            if (!input) {
                showToast('⚠️ Lütfen IP adresleri girin (virgül veya satır ile ayırın)', 'error');
                return;
            }

            const ips = input.split(/[\n,;]+/).map(s => s.trim()).filter(s => s);
            if (ips.length < 2) {
                showToast('⚠️ En az 2 IP adresi girin!', 'error');
                return;
            }

            showToast(`🔍 ${ips.length} IP sorgulanıyor...`, 'info');
            
            const results = [];
            ips.forEach(async (ip, index) => {
                const result = await queryIPWithFallback(ip);
                if (!result.error) {
                    results.push(result.data);
                }
                
                if (index === ips.length - 1) {
                    displayBatchResults(results);
                }
            });
        }

        function displayBatchResults(results) {
            const container = document.getElementById('resultContainer');
            let html = `
                <div class="result-card">
                    <div class="result-title">
                        <i class="fas fa-layer-group"></i>
                        📊 TOPLU SORGULAMA (${results.length} IP)

                    <div style="overflow-x:auto;margin-top:10px;">
                        <table style="width:100%;border-collapse:collapse;font-size:0.8rem;">
                            <thead>

                                    <th style="padding:10px;text-align:left;">Şehir</th>
                                    <th style="padding:10px;text-align:left;">ISP</th>
                                    <th style="padding:10px;text-align:left;">Konum</th>
                                </tr>
                            </thead>
                            <tbody>

            results.forEach(r => {

                    <tr style="border-bottom:1px solid var(--border-glow-pink);">
                        <td style="padding:8px;font-family:'Fira Code',monospace;">${r.ip || '-'}</td>
                        <td style="padding:8px;">${r.country || '-'}</td>
                        <td style="padding:8px;">${r.city || '-'}</td>

                        <td style="padding:8px;">${r.loc || '-'}</td>
                    </tr>
                `;
            });

            html += `
                            </tbody>

                        <button class="btn btn-ghost" onclick="exportBatchResults()" style="padding:6px 18px;font-size:0.7rem;">
                            <i class="fas fa-download"></i> CSV İndir
                        </button>
                    </div>
                </div>
            `;

            container.innerHTML = html;
            window._batchResults = results;
        }

        function exportBatchResults() {
            const results = window._batchResults || [];
            if (results.length === 0) {
                showToast('⚠️ Sonuç yok!', 'error');
                return;
            }

            let csv = 'IP,Ülke,Şehir,ISP,Konum\n';
            results.forEach(r => {
                csv += `${r.ip || '-'},${r.country || '-'},${r.city || '-'},${r.org || '-'},${r.loc || '-'}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const link = document.createElement('a');
            link.download = `batch_results_${Date.now()}.csv`;
            link.href = URL.createObjectURL(blob);
            link.click();
            URL.revokeObjectURL(link.href);
            
            showToast('✅ CSV dosyası indirildi!', 'success');
        }

        
        async function queryIP(ip) {
            const container = document.getElementById('resultContainer');
            container.innerHTML = `
                <div class="result-card loading">
                    <div class="spinner-ring"></div>
                    <p class="loading-text">🔍 ${ip} sorgulanıyor...</p>
                </div>
            `;

            try {
                const result = await queryIPWithFallback(ip);
                
                if (result.error) {
                    displayResults(result, ip);
                    return;
                }

                const data = result.data;

               
                try {
                    
                    const whois = await queryWhois(ip);
                    if (whois) data._whois = whois;
                    
                   
                    const reverse = await reverseDNS(ip);
                    if (reverse) data._reverse = reverse;
                    
                    
                } catch (e) {
                    console.warn('Ek bilgiler alınamadı:', e);
                }

                displayResults({ data, source: result.source }, ip);
                showToast(`✅ ${ip} sorgulandı`, 'success');

            } catch (error) {
                displayResults({ error: true, message: error.message || 'Beklenmeyen hata' }, ip);
                showToast(`❌ Hata: ${error.message}`, 'error');
            }
        }

        
        document.getElementById('queryBtn').addEventListener('click', async () => {
            const input = document.getElementById('ipInput').value.trim();
            if (!input) {
                showToast('⚠️ Lütfen bir IP adresi girin!', 'error');
                return;
            }

            
            const ipRegex = /^(\d{1,3}\.){3}\d{1,3}$/;
            const domainRegex = /^[a-zA-Z0-9][a-zA-Z0-9-]{1,61}[a-zA-Z0-9]\.[a-zA-Z]{2,}$/;

            if (!ipRegex.test(input) && !domainRegex.test(input)) {
                showToast('⚠️ Geçersiz IP veya domain formatı!', 'error');
                return;
            }

            await queryIP(input);
        });

        
        document.getElementById('ipInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('queryBtn').click();
            }
        });

        
        document.getElementById('myIpBtn').addEventListener('click', async () => {
            showToast('🔍 IP adresiniz alınıyor...', 'info');
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                if (data.ip) {
                    document.getElementById('ipInput').value = data.ip;
                    await queryIP(data.ip);
                }
            } catch (error) {
                showToast(`❌ IP alınamadı: ${error.message}`, 'error');
            }
        });

        
        document.getElementById('screenshotBtn').addEventListener('click', takeScreenshot);

        
        document.getElementById('batchBtn').addEventListener('click', batchQuery);


        
        window.addEventListener('load', () => {
            
            document.getElementById('ipInput').value = '8.8.8.8';
            setTimeout(() => {
                document.getElementById('queryBtn').click();
            }, 500);
            
            
            renderHistory();
        });

        
        window.addEventListener('resize', () => {
            if (mapInstance) {
                setTimeout(() => mapInstance.invalidateSize(), 200);
            }
        });

        console.log('🔥 IP OSINT  yüklendi!');
        console.log('📌 Geliştirici: KADRBEQUİT');
        console.log('🔒 DDoS Korumalı | SSL Şifreli');
    </script>
</body>
</html>
